<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeedCode Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Big+Shoulders+Display:wght@900&family=League+Gothic&family=Oswald:wght@500&family=Inter:wght@400;600&family=Playfair+Display:wght@700;900&family=Plus+Jakarta+Sans:wght@500;800&family=Montserrat:wght@800&family=Poppins:wght@700&family=Raleway:wght@800&family=Rubik:wght@800&family=Lora:wght@700&family=Merriweather:wght@900&family=Cormorant+Garamond:wght@700&family=Space+Grotesk:wght@700&family=Cinzel:wght@700&family=Barlow+Condensed:wght@800&family=Teko:wght@600&family=DM+Serif+Display&family=Abril+Fatface&family=Alfa+Slab+One&family=Archivo+Black&family=Righteous&family=Fjalla+One&family=Staatliches&family=Dancing+Script:wght@700&family=Pacifico&family=Permanent+Marker&family=Cinzel+Decorative:wght@700&family=Marcellus&family=Marcellus+SC&family=Cormorant+SC:wght@700&family=Cormorant+Unicase:wght@700&family=Forum&family=Bellefair&family=Gloock&family=Fraunces:wght@900&family=Libre+Caslon+Display&family=Playfair+Display+SC:wght@900&family=Spectral+SC:wght@700&family=Alegreya+SC:wght@800&family=Uncial+Antiqua&family=Josefin+Sans:wght@700&family=Lexend:wght@800&family=Unbounded:wght@800&family=Bowlby+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
:root{--bg:#0B0F19;--pn:#111827;--bd:#1f2937;--tx:#e5e7eb;--mu:#9ca3af;--ac:#f5b942;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:340px 1fr 260px;min-height:100vh}
aside{background:var(--pn);padding:16px;overflow:auto;max-height:100vh}
aside.l{border-right:1px solid var(--bd)}aside.r{border-left:1px solid var(--bd)}
h1{font:800 18px 'Plus Jakarta Sans',sans-serif;margin:0 0 12px}h1 span{color:var(--ac)}
h3{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px;font:inherit}
input[type=range]{width:100%}input[type=color]{width:100%;height:32px;border:0;background:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);margin:8px 0}
main{padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.tp button{background:var(--pn);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
.tabs button.on,.tp button.on{border-color:var(--ac);color:var(--ac)}
.tp{display:grid;gap:6px}.tp button{text-align:left}
#box{width:100%;flex:1;display:flex;align-items:center;justify-content:center;min-height:300px}
#wrap{transform-origin:center;flex:none}
#stage{position:relative;overflow:hidden;font-family:Inter,sans-serif}
#stage em{font-style:italic;color:var(--a)}
.go{width:100%;margin-top:14px;background:var(--ac);color:#111;border:0;border-radius:10px;padding:12px;font:800 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.go:disabled{opacity:.5}.mini{background:var(--bg);border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:4px 10px;margin-top:4px;cursor:pointer}#stage .cw{display:block;font-size:.4em;letter-spacing:.14em;line-height:1.7;text-transform:uppercase;font-weight:400}select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pal button{height:36px;border:2px solid var(--bd);border-radius:8px;cursor:pointer}.pal button:hover{border-color:var(--ac)}small{color:var(--mu);display:block;margin-top:8px;line-height:1.4}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{max-height:none}aside.l{order:2}aside.r{order:3}main{order:1}}
</style></head><body>
<div class="app">
<aside class="l"><h1>Deed<span>Code</span> Studio</h1>
<h3>Sermon</h3>
<label>Series / event tag</label><input type="text" data-k="tag">
<label>Title (wrap a word in *stars* to highlight)</label><textarea rows="2" data-k="title"></textarea>
<label>Subtitle / scripture</label><input type="text" data-k="sub">
<label>Speaker name &amp; title</label><input type="text" data-k="speaker">
<label>Date / service time</label><input type="text" data-k="date">
<h3>Portrait</h3>
<input type="file" id="file" accept="image/*">
<label>Scale</label><input type="range" min="60" max="160" data-k="scale">
<label>X offset</label><input type="range" min="-30" max="30" data-k="x">
<label>Y offset</label><input type="range" min="-30" max="30" data-k="y">
<label>Edge feathering</label><input type="range" min="0" max="50" data-k="feather">
<div class="chk"><input type="checkbox" data-k="bw" id="bw"><label for="bw" style="margin:0;color:var(--tx)">B&amp;W high-contrast mode</label></div>
<h3>Background &amp; extra image</h3>
<label>Upload background</label><input type="file" id="bgf" accept="image/*"><button class="mini" id="bgx">Remove</button>
<label>Background blur</label><input type="range" min="0" max="20" data-k="blur">
<label>Brand-colour tint over background</label><input type="range" min="0" max="85" data-k="tint">
<label>Upload image (art, symbol, logo)</label><input type="file" id="imf" accept="image/*"><button class="mini" id="imx">Remove</button>
<label>Image size</label><input type="range" min="15" max="250" data-k="iscale">
<label>Image left / right</label><input type="range" min="-60" max="60" data-k="ix">
<label>Image up / down</label><input type="range" min="-60" max="60" data-k="iy">
<label>Image opacity</label><input type="range" min="10" max="100" data-k="iop">
<div class="chk"><input type="checkbox" data-k="ifront" id="ifr"><label for="ifr" style="margin:0;color:var(--tx)">Image in front of text</label></div>
<h3>Brand kit (saved on this device)</h3>
<div class="row"><div><label>Primary</label><input type="color" data-k="c1"></div><div><label>Accent</label><input type="color" data-k="c2"></div></div>
<label>Handle / website</label><input type="text" data-k="handle">
</aside>
<main><div class="tabs" id="tabs"></div><div id="box"><div id="wrap"><div id="stage"></div></div></div></main>
<aside class="r"><h3>Design systems</h3><div class="tp" id="tp"></div>
<h3>Texture</h3>
<label>Film grain</label><input type="range" min="0" max="8" step=".5" data-k="grain">
<label>Vignette</label><input type="range" min="0" max="80" data-k="vig">
<label>Bottom scrim</label><input type="range" min="0" max="90" data-k="scrim">
<h3>Title font</h3><select data-k="font" id="fontsel"></select>
<label>Title size</label><input type="range" min="40" max="160" data-k="size">
<label>Letter spacing</label><input type="range" min="-3" max="15" data-k="ls">
<label>Text case</label><select data-k="caps"><option value="auto">Template default</option><option value="upper">UPPERCASE</option><option value="normal">Normal case</option></select>
<label>Text colour</label><select data-k="tc"><option value="auto">Auto</option><option value="white">White</option><option value="dark">Deep charcoal</option><option value="accent">Accent colour</option></select>
<div class="chk"><input type="checkbox" data-k="conn" id="conn"><label for="conn" style="margin:0;color:var(--tx)">Small connector words (of, the, and…)</label></div>
<label>Text effect</label><select data-k="fx"><option value="none">None</option><option value="shadow">Soft shadow</option><option value="hard">Hard shadow</option><option value="3d">3D extrude</option><option value="outline">Outline</option><option value="glow">Neon glow</option><option value="gradient">Gradient text</option></select>
<label>Subtitle &amp; speaker font</label><select data-k="font2" id="font2sel"></select>
<label>Subtitle &amp; speaker size</label><input type="range" min="60" max="160" data-k="ssize">
<h3>Colour &amp; gradient</h3><div class="pal" id="pal"></div><label>Background style</label><select data-k="bgm"><option value="auto">Template default</option><option value="linear">Linear gradient</option><option value="radial">Radial spotlight</option><option value="mesh">Mesh glow</option><option value="dusk">Dusk fade</option><option value="solid">Solid brand colour</option></select>
<button class="go" id="go">Download Artwork Pack<br>(PNG + Low-Data WebP)</button>
<small id="msg">Exports 16:9, 1:1 and 9:16 in one ZIP.</small></aside>
</div>
<script>
const R={'16:9':[1920,1080],'1:1':[1080,1080],'9:16':[1080,1920]};
const NM=['Editorial Split','Charismatic Glow','Typographic Card','Convention Banner','Glass Card','Broadcast Thumbnail','Bold Stack','Neon Night','Sunrise Poster','Photo Hero','Ministry Cover'];
const PAL=[['Royal Gold','#1c3a5e','#f5b942'],['Forest Amber','#14352a','#e8a33d'],['Crimson Fire','#5a0f1c','#ff7a3d'],['Violet Glow','#2b1458','#c084fc'],['Ocean Teal','#0b3b4a','#2dd4bf'],['Rose Dusk','#4a1d3f','#fb7185'],['Obsidian Gold','#0d0d0d','#d4af37'],['Sky Day','#1e5aa8','#fde047']];
const TALL=['Anton','Bebas Neue','League Gothic','Oswald','Big Shoulders Display','Teko','Fjalla One','Staatliches','Barlow Condensed'];
const FG={'Tall & condensed':TALL,'Serif':['Playfair Display','Playfair Display SC','DM Serif Display','Abril Fatface','Cinzel','Cinzel Decorative','Marcellus','Marcellus SC','Cormorant Garamond','Cormorant SC','Cormorant Unicase','Forum','Bellefair','Gloock','Fraunces','Libre Caslon Display','Spectral SC','Alegreya SC','Lora','Merriweather','Alfa Slab One','Uncial Antiqua'],'Sans':['Plus Jakarta Sans','Montserrat','Poppins','Raleway','Rubik','Archivo Black','Space Grotesk','Righteous','Josefin Sans','Lexend','Unbounded','Bowlby One','Inter'],'Script & display':['Dancing Script','Pacifico','Permanent Marker']};
const FW={'Playfair Display':900,'Montserrat':800,'Poppins':700,'Raleway':800,'Rubik':800,'Lora':700,'Merriweather':900,'Cormorant Garamond':700,'Plus Jakarta Sans':800,'Oswald':500,'Space Grotesk':700,'Cinzel':700,'Barlow Condensed':800,'Teko':600,'Big Shoulders Display':900,'Dancing Script':700,'Cinzel Decorative':700,'Cormorant SC':700,'Cormorant Unicase':700,'Fraunces':900,'Playfair Display SC':900,'Spectral SC':700,'Josefin Sans':700,'Lexend':800,'Unbounded':800,'Alegreya SC':800};
for(const id of ['fontsel','font2sel']){document.getElementById(id).innerHTML='<option value="auto">Template default</option>'+Object.entries(FG).map(([g,l])=>`<optgroup label="${g}">`+l.map(f=>`<option>${f}</option>`).join('')+'</optgroup>').join('')}
const sil="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#5b6478"/><circle cx="200" cy="170" r="85" fill="#cbd2e0"/><path d="M40 500c0-130 70-210 160-210s160 80 160 210z" fill="#cbd2e0"/></svg>');
let s={tag:'SERIES 4 • PART 2',title:'The *Spirit* of Wisdom',sub:'Principles of Hunger and Thirst — John 7:37',speaker:'Pastor Chris Onayinka',date:'SUNDAY • 9:00 AM',photo:sil,scale:100,x:0,y:0,feather:25,bw:false,tpl:1,ratio:'16:9',c1:'#1c3a5e',c2:'#f5b942',handle:'@yourchurch',grain:4,vig:30,scrim:50,font:'auto',bgm:'auto',size:100,ssize:100,fx:'none',ls:0,caps:'auto',font2:'auto',bgimg:'',blur:0,tint:35,img:'',ix:0,iy:0,iscale:100,iop:100,ifront:false,conn:false,tc:'auto'};
try{Object.assign(s,JSON.parse(localStorage.getItem('dcs-kit')||'{}'))}catch(e){}
const $=q=>document.querySelector(q),st=$('#stage');
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=t=>esc(t).replace(/\*(.+?)\*/g,'<em>$1</em>');
const CW=/\b(of|the|and|is|in|as|a|for|with|on|to|at|by|who|am|i)\b/gi;const hl2=t=>{let x=esc(t);if(s.conn)x=x.replace(CW,'<span class="cw">$1</span>');return x.replace(/\*(.+?)\*/g,'<em>$1</em>')};
const noise="url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>\")";
function lum(h){const n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255}
function render(){
 const [W,H]=R[s.ratio],P=H>W,t=+s.tpl,u=Math.min(W,H)/100;
 const light=(t==1||t==11)&&s.bgm=='auto'&&!s.bgimg,ph=![3,7,11].includes(t);
 const a=s.c2,fg=s.tc=='white'?'#fff':s.tc=='dark'?'#14110f':s.tc=='accent'?a:light?'#14110f':'#fff';
 const bgs={1:'#f4efe6',2:`radial-gradient(circle at ${P?'50% 70%':'75% 50%'},${s.c1} 0%,#070b14 68%)`,3:`linear-gradient(135deg,${s.c1},#05070d)`,4:`radial-gradient(at 15% 20%,${s.c2}99,transparent 50%),radial-gradient(at 85% 80%,${s.c1},transparent 60%),#0a0d18`,5:`radial-gradient(at 20% 30%,${s.c2},transparent 45%),radial-gradient(at 80% 70%,${s.c1},transparent 55%),#111`,6:`linear-gradient(120deg,${s.c1},#000)`,7:s.c1,8:`radial-gradient(circle at 50% 120%,${s.c1},#05030f 60%)`,9:`linear-gradient(180deg,${s.c2},${s.c1})`,10:'#000',11:`linear-gradient(160deg,#fbf7ee,${s.c2}66)`};
 const ov={linear:`linear-gradient(135deg,${s.c1},${s.c2})`,radial:`radial-gradient(circle at 50% 40%,${s.c2},${s.c1} 70%,#000)`,mesh:bgs[4],solid:s.c1,dusk:`linear-gradient(180deg,${s.c1},#000)`};if(ov[s.bgm])bgs[t]=ov[s.bgm];
 const dfl={2:'Bebas Neue',4:'Bebas Neue',6:'Bebas Neue',7:'Anton',8:'Oswald',10:'Bebas Neue',11:'Cinzel'};const fam=s.font!='auto'?s.font:dfl[t];const bebas=TALL.includes(fam),F2=s.font2!='auto'?`'${s.font2}',sans-serif`:'Inter,sans-serif',F3=s.font2!='auto'?F2:"'Plus Jakarta Sans',sans-serif",ink=light?'#14110f':'#fff';const fxs={shadow:`text-shadow:0 ${u*.5}px ${u*2}px rgba(0,0,0,.6);`,hard:`text-shadow:${u*.5}px ${u*.5}px 0 ${a},${u}px ${u}px 0 #0006;`,'3d':'text-shadow:'+[1,2,3,4,5,6].map(n=>`${n*u*.15}px ${n*u*.15}px 0 ${s.c1}`).join(',')+';',outline:`color:transparent;-webkit-text-stroke:${u*.35}px ${ink};`,glow:`text-shadow:0 0 ${u*1.5}px ${a},0 0 ${u*4}px ${a};`,gradient:`background:linear-gradient(90deg,${ink},${a});-webkit-background-clip:text;background-clip:text;color:transparent;`};const tf=fam?`'${fam}',sans-serif`:t==3?"'Plus Jakarta Sans',sans-serif":"'Playfair Display',serif";
 const k=bebas?.42:.58,lh=bebas?.95:1.05;
 const hero=t==10,hasPh=ph&&t!=5&&!hero,card=t==5,ctr=t==7||t==11;
 const bgi=s.bgimg?`<img src="${s.bgimg}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(${s.blur}px);transform:scale(1.06)"><div style="position:absolute;inset:0;background:${s.c1};opacity:${s.tint/100}"></div>`:'';
 const imgh=s.img?`<img src="${s.img}" style="position:absolute;left:${50+s.ix}%;top:${50+s.iy}%;width:${W*.5*s.iscale/100}px;transform:translate(-50%,-50%);opacity:${s.iop/100};object-fit:contain">`:'';
 const tw=P?W*.84:card?W*.7:hasPh?W*.54:W*.84, th=P?H*.34:H*.46;
 const mx=bebas?(P?W*.2:H*.26):H*.17;
 const fs=Math.max(u*4,Math.min(mx,Math.sqrt(tw*th/((s.title.length||1)*k*lh))))*s.size/100;
 const g=s.feather;
 let ph_html='';
 if(hasPh){const w=P?W:W*.48,h=P?H*.56:H,mask=`linear-gradient(${P?'to top':'to left'},#000 ${100-g*1.6}%,transparent)`;
  ph_html=`<div style="position:absolute;${P?'left:0;bottom:0':'right:0;bottom:0'};width:${w}px;height:${h}px;overflow:hidden"><img src="${s.photo}" style="width:100%;height:100%;object-fit:cover;object-position:top;transform:translate(${s.x}%,${s.y}%) scale(${s.scale/100});-webkit-mask-image:${mask};mask-image:${mask};filter:${s.bw?'grayscale(1) contrast(1.3)':'none'}"></div>`}
 if(hero)ph_html=`<img src="${s.photo}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transform:translate(${s.x}%,${s.y}%) scale(${s.scale/100});filter:${s.bw?'grayscale(1) contrast(1.3)':'none'}">`;
 const wm=t==3?`<div style="position:absolute;right:-4%;top:-6%;font:${H*.55}px 'Bebas Neue';color:#fff;opacity:.05;line-height:1;white-space:nowrap">${esc((s.title.replace(/\*/g,'').split(' ')[0]||'').toUpperCase())}</div>`:'';
 const grid=t==3||t==7?`<div style="position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:${u*8}px ${u*8}px"></div>`:'';
 const pill=(x,c)=>x?`<span style="display:inline-block;padding:${u*.8}px ${u*2.2}px;border-radius:99px;font:600 ${u*2.4}px Inter;letter-spacing:.12em;${c}">${esc(x.toUpperCase())}</span>`:'';
 const wave=t==3?`<div style="margin-top:${u*3}px;display:flex;align-items:flex-end;gap:${u*.6}px;height:${u*5}px">${[3,5,2,5,4,2,5,3,4,2].map(n=>`<i style="width:${u*.7}px;height:${n*u}px;background:${a};border-radius:9px"></i>`).join('')}<b style="margin-left:${u*2}px;font:600 ${u*2.4}px Inter;letter-spacing:.15em">LISTEN NOW · TEACHINGS</b></div>`:'';
 const play=t==6?`<div style="position:absolute;${P?'right:'+u*6+'px;top:'+H*.5+'px':'right:'+W*.06+'px;bottom:'+H*.08+'px'};width:${u*13}px;height:${u*13}px;border-radius:50%;background:${a};display:flex;align-items:center;justify-content:center"><div style="border-left:${u*4.5}px solid #111;border-top:${u*3}px solid transparent;border-bottom:${u*3}px solid transparent;margin-left:${u}px"></div></div>`:'';
 const left=ctr?(W-tw)/2:P?W*.08:card?W*.15:W*.07;
 const boxStyle=card?`background:#ffffff26;backdrop-filter:blur(${u*3}px);-webkit-backdrop-filter:blur(${u*3}px);border:1px solid #ffffff55;border-radius:${u*3}px;padding:${u*5}px;left:${W*.1}px;width:${W*.8}px;`:`left:${left}px;width:${tw}px;`;
 const avatar=card?`<img src="${s.photo}" style="width:${u*12}px;height:${u*12}px;border-radius:50%;object-fit:cover;object-position:top;margin-right:${u*2.5}px;filter:${s.bw?'grayscale(1)':'none'}">`:'';
 st.style.cssText=`--a:${a};width:${W}px;height:${H}px;background:${bgs[t]};color:${fg};position:relative;overflow:hidden`;
 st.innerHTML=`${bgi}${wm}${grid}${ph_html}${s.ifront?'':imgh}
 <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,${light?0:Math.max(s.scrim,hero?80:0)/100}),transparent 55%)"></div>
 <div style="position:absolute;inset:0;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,${s.vig/100}))"></div>
 <div style="position:absolute;${boxStyle}top:${P?H*.07:card?'50%':H*.08}px;${card?'transform:translateY(-50%);':'height:'+(P?(hero?H*.86:H*.45):H*.84)+'px;'}display:flex;flex-direction:column;justify-content:${card?'flex-start':hero?'flex-end':'center'};gap:${u*2.5}px;text-align:${ctr?'center':'left'};align-items:${ctr?'center':'stretch'}">
  <div>${pill(s.tag,t==1?`background:${s.c1};color:#fff`:`background:${a};color:${lum(a)>.55?'#111':'#fff'}`)}</div>
  <div style="font:${FW[fam||(t==3?'Plus Jakarta Sans':'Playfair Display')]||400} ${fs}px/${lh} ${tf};${(s.caps=='auto'?bebas:s.caps=='upper')?'text-transform:uppercase;':''}letter-spacing:${(bebas?1:0)/100+s.ls/100}em;${t==8&&s.fx=='none'?'text-shadow:0 0 '+u*3+'px '+a+';':''}${fxs[s.fx]||''}${t==2?'border-bottom:'+u*.8+'px solid '+a+';padding-bottom:'+u*2+'px;':''}">${hl2(s.title)}</div>
  <div style="font:${FW[s.font2]||500} ${u*3*s.ssize/100}px/1.35 ${F2};opacity:.85">${hl(s.sub)}</div>
  <div style="display:flex;align-items:center;margin-top:${u}px">${avatar}<div><div style="font:${FW[s.font2]||800} ${u*3.2*s.ssize/100}px ${F3}">${esc(s.speaker)}</div><div style="font:600 ${u*2.2}px Inter;letter-spacing:.14em;color:${a};margin-top:${u*.6}px">${esc((s.date||'').toUpperCase())}</div></div></div>${wave}
 </div>${s.ifront?imgh:''}${play}
